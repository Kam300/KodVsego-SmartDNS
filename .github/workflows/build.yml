name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build APK
        working-directory: android
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SmartDNS-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EXE
        shell: cmd
        run: build.bat
      - name: Test Windows logic
        shell: powershell
        run: |
          # The native smoke test needs an active network adapter on the runner.
          ./tests/run.ps1
      - name: Test native DLL search
        shell: powershell
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /target:exe /out:dist\dev\ProcessSecurityTests.exe src\windows\Platform\ProcessSecurity.cs tests\ProcessSecurity.Tests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/dev/ProcessSecurityTests.exe
      - name: Test UI motion and idle timer
        shell: powershell
        run: ./tests/UiMotion.Tests.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SmartDNS-Windows
          path: dist/dev/KodVsego_SmartDNS.*.exe
