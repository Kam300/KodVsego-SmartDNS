name: Review DNS provider address changes
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dns-catalog-observer
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test observer with offline fixtures
        run: python -m unittest discover -s tests -p test_provider_watcher.py
      - name: Observe official setup pages
        run: python tools/watch_provider_catalog.py
      - name: Retain review report
        uses: actions/upload-artifact@v4
        with:
          name: dns-provider-observations
          path: |
            config/provider-observations.json
            docs/PROVIDER-CATALOG-PROPOSAL.md
          if-no-files-found: ignore
      - name: Open review proposal without modifying the live catalog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch=automation/dns-catalog-review
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo 'An open proposal is awaiting review; its branch is left unchanged.'
            exit 0
          fi
          git add config/provider-observations.json docs/PROVIDER-CATALOG-PROPOSAL.md
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin "$branch" || true
          git checkout -B "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Propose DNS provider address observations for review'
          git push --force-with-lease origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title 'Review DNS provider address changes' --body-file docs/PROVIDER-CATALOG-PROPOSAL.md
