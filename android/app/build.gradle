plugins { id 'com.android.application' }

android {
    namespace 'ru.kodvsego.smartdns'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.kodvsego.smartdns'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.5.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDirs = ['src/main/assets', '../../res/service-icons']
    def signingFile = rootProject.file('signing.properties')
    if (signingFile.exists()) {
        def signing = new Properties()
        signingFile.withInputStream { signing.load(it) }
        signingConfigs {
            release {
                storeFile rootProject.file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        preview {
            initWith debug
            applicationIdSuffix '.test'
            versionNameSuffix '-test.1'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
    lint { abortOnError true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

// Shared provider catalog. IDs are append-only to preserve saved preferences.
def providerConfig = rootProject.file('../config/providers.json')
def providerOutput = file('src/main/java/ru/kodvsego/smartdns/ProviderAvailability.java')
def generateProviderAvailability = tasks.register('generateProviderAvailability') {
    inputs.file(providerConfig)
    outputs.file(providerOutput)
    doLast {
        def entries = new groovy.json.JsonSlurper().parse(providerConfig, 'UTF-8')
        def keys = ['comss','geohide','geohide-eu','xbox','bezmezhau','dns-ai','magicdns']
        if (!(entries instanceof List) || entries.size()<7 || entries.collect{it.key}.toSet().size()!=entries.size()) throw new GradleException('Invalid provider catalog')
        entries.eachWithIndex { p, i ->
            [enabled:true,encryptedOnly:false,ipv6:[],legacyIpv4:[],windowsDohServers:p.ipv4,services:[],autoGoals:[],testHosts:['example.com'],description:'',site:'',url:'',doh:null].each { field, value -> if(!p.containsKey(field))p[field]=value }
            if(p.id!=i || (i<7 && p.key!=keys[i]) || !(p.enabled instanceof Boolean) || !(p.encryptedOnly instanceof Boolean) || !p.name || !p.ipv4 || !p.windowsDohServers || !p.testHosts || (p.encryptedOnly && !p.doh)) throw new GradleException('Invalid provider '+i)
            if(!(p.key instanceof String) || !(p.key ==~ /[a-z0-9-]+/) || !(p.name instanceof String) || !p.name.trim() || (p.doh!=null && !p.doh.trim())) throw new GradleException('Invalid name or DoH')
            ['ipv4','ipv6','legacyIpv4','windowsDohServers','services','autoGoals','testHosts'].each { field -> if(!(p[field] instanceof List))throw new GradleException(field+' must be an array') }
            p.legacyIpv4.each { old ->
                if(!(old instanceof List) || !old || old.any { ip -> !(ip instanceof String) || !(ip ==~ /[0-9]+(\.[0-9]+){3}/) || ip.split('\\.').any { it.toInteger()>255 } }) throw new GradleException('Invalid legacy IPv4 set')
            }
            ['ipv4','windowsDohServers'].each { field -> p[field].each { ip ->
                if(!(ip instanceof String) || !(ip ==~ /[0-9]+(\.[0-9]+){3}/) || ip.split('\\.').any { it.toInteger()>255 }) throw new GradleException('Invalid IPv4')
            } }
            p.ipv6.each { ip -> if(!(ip instanceof String) || !ip.contains(':') || !(ip ==~ /[0-9a-fA-F:.]+/) || !(java.net.InetAddress.getByName(ip) instanceof java.net.Inet6Address))throw new GradleException('Invalid IPv6') }
            p.testHosts.each { host -> if(!(host instanceof String) || !(host ==~ /[a-zA-Z0-9_\-]+(\.[a-zA-Z0-9_\-]+)*\.?/))throw new GradleException('Invalid hostname') }
            if(p.autoGoals.any{ !(it in ['ChatGPT','Claude','Gemini','ElevenLabs','Spotify','Xbox','Antigravity']) }) throw new GradleException('Unknown auto goal')
            [p.doh,p.url].findAll{it}.each { value ->
                def uri = new URI(value)
                if(uri.scheme!='https' || !uri.host || uri.userInfo || (value==p.doh && uri.fragment)) throw new GradleException('Invalid HTTPS URL')
            }
        }
        if(!entries.any { it.enabled })throw new GradleException('At least one provider must remain enabled.')
        def quote = { value -> groovy.json.JsonOutput.toJson(value) }
        def strings = { values -> 'new String[]{'+values.collect{quote(it)}.join(',')+'}' }
        def flags = entries.collect{it.enabled.toString()}.join(',')
        def rows = entries.collect{ p -> 'new Provider('+quote(p.name)+','+strings(p.ipv4)+','+quote(p.doh)+','+p.encryptedOnly+','+strings(p.services)+','+strings(p.testHosts)+')' }.join(',\n')
        providerOutput.parentFile.mkdirs()
        providerOutput.setText("""// Generated from config/providers.json. Do not edit directly.
package ru.kodvsego.smartdns;
final class ProviderAvailability {
    private static final boolean[] ENABLED = { ${flags} };
    static boolean isEnabled(int id) { return id>=0 && id<ENABLED.length && ENABLED[id]; }
    static Provider[] create() {return new Provider[]{ ${rows} };}
}
""", 'UTF-8')
    }
}
tasks.named('preBuild').configure { dependsOn(generateProviderAvailability) }
